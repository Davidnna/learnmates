{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<section class="auth-wrap"><div class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Log in</h1><p class="muted">Pick up where your learning left off.</p>
<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button primary full" type="submit">Log in</button></form>
<p class="auth-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>{% endblock %}
